# Notes: Markdown Notes for Noctalia
# Local fork of noctalia/notes with a rendered markdown preview toggle added.

id = "duchovs/notes"
name = "Notes (local fork)"
version = "1.1.0"
plugin_api = 21
author = "duchovs"
license = "MIT"
dependencies = []
tags = ["productivity"]
icon = "notes"
description = "Quick markdown notes in a full-height side panel, with a rendered preview toggle."

[[setting]]
key = "notes_dir"
type = "folder"
label_key = "settings.notes_dir.label"
description_key = "settings.notes_dir.description"
default = "~/Documents/Notes"

[[setting]]
key = "extension"
type = "string"
label_key = "settings.extension.label"
description_key = "settings.extension.description"
default = "md"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 420
height = "fill"
placement = "floating"
position = "center_right"

[[launcher_provider]]
id = "launcher"
entry = "launcher.luau"
prefix = "nt"
glyph = "notes"
include_in_global_search = false

[[widget]]
id = "notes"
entry = "notes.luau"

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyph.label"
  default = "notes"
